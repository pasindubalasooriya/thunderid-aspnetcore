# End-to-end test resources, imported by ThunderID's setup.sh next to its defaults.
# The client secret and the user's password are fixed TEST-ONLY values for this
# throwaway container. Never reuse them anywhere else.
resource_type: flow
id: 01900000-0000-7000-8000-0000000e2e01
ouHandle: default
name: E2E Authentication Flow
handle: e2e-auth-flow
flowType: AUTHENTICATION
nodes:
- id: start
  type: START
  onSuccess: sso_check
- id: sso_check
  type: TASK_EXECUTION
  executor:
    name: SSOCheckExecutor
  properties:
    checkpointRef: session
  onSuccess: session
  onFailure: prompt_credentials
- id: prompt_credentials
  type: PROMPT
  meta:
    components:
    - type: TEXT
      id: text_001
      label: '{{ t(signin:forms.credentials.title) }}'
      variant: HEADING_1
    - type: BLOCK
      id: block_001
      components:
      - id: input_001
        ref: username
        type: TEXT_INPUT
        label: '{{ t(signin:forms.credentials.fields.username.label) }}'
        required: true
      - id: input_002
        ref: password
        type: PASSWORD_INPUT
        label: '{{ t(signin:forms.credentials.fields.password.label) }}'
        required: true
      - type: ACTION
        id: action_001
        label: '{{ t(signin:forms.credentials.actions.submit.label) }}'
        variant: PRIMARY
        eventType: SUBMIT
    - category: DISPLAY
      id: rich_text_signup
      action:
        ref: action_signup
      label: <p data-component-ref="self-sign-up-link" class="rich-text-paragraph"><span class="rich-text-pre-wrap">{{ t(signin:forms.credentials.links.sign_up.prefix) }} </span><a href="#" data-action-ref="action_signup" class="rich-text-link"><span class="rich-text-pre-wrap">{{ t(signin:forms.credentials.links.sign_up.label) }}</span></a></p>
      resourceType: ELEMENT
      type: RICH_TEXT
  prompts:
  - inputs:
    - ref: input_001
      identifier: username
      type: TEXT_INPUT
      required: true
    - ref: input_002
      identifier: password
      type: PASSWORD_INPUT
      required: true
    action:
      ref: action_001
      nextNode: credentials_auth
  - action:
      ref: action_signup
      nextNode: call_registration
- id: credentials_auth
  type: TASK_EXECUTION
  executor:
    name: CredentialsAuthExecutor
  onSuccess: session
  onIncomplete: prompt_credentials
- id: call_registration
  type: CALL
  flow:
    ref: 01900000-0000-7000-8000-0000000e2e04
  onSuccess: authorization_check
- id: session
  type: TASK_EXECUTION
  executor:
    name: SessionExecutor
  onSuccess: authorization_check
- id: authorization_check
  type: TASK_EXECUTION
  executor:
    name: AuthorizationExecutor
  onSuccess: auth_assert
- id: auth_assert
  type: TASK_EXECUTION
  executor:
    name: AuthAssertExecutor
  onSuccess: end
- id: end
  type: END
---
# A copy of ThunderID's Default Registration Flow (pinned commit 46a6afc35) whose final
# CALL returns to the E2E Authentication Flow instead of the default one.
resource_type: flow
id: 01900000-0000-7000-8000-0000000e2e04
ouHandle: default
name: E2E Registration Flow
handle: e2e-registration-flow
flowType: REGISTRATION
nodes:
- id: start
  type: START
  onSuccess: user_type_resolver
  layout:
    size:
      width: 101
      height: 34
    position:
      x: -2
      y: 479
- id: user_type_resolver
  type: TASK_EXECUTION
  executor:
    name: UserTypeResolver
  onSuccess: prompt_credentials
  onIncomplete: prompt_usertype
  layout:
    size:
      width: 244
      height: 113
    position:
      x: 244
      y: 440
- id: prompt_usertype
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signup:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
      width: ''
    - align: center
      type: TEXT
      id: heading_usertype
      label: '{{ t(signup:forms.user_type.title) }}'
      variant: HEADING_1
    - type: BLOCK
      id: block_usertype
      components:
      - type: SELECT
        id: usertype_input
        ref: userType
        label: '{{ t(signup:forms.user_type.fields.user_type.label) }}'
        placeholder: '{{ t(signup:forms.user_type.fields.user_type.placeholder) }}'
        required: true
        options: []
      - type: ACTION
        id: action_usertype
        label: '{{ t(signup:forms.user_type.actions.continue.label) }}'
        variant: PRIMARY
        eventType: SUBMIT
    - category: DISPLAY
      id: rich_text_signin_usertype
      action:
        ref: action_signin_usertype
      label: <p data-component-ref="sign-in-link" class="rich-text-paragraph"><span class="rich-text-pre-wrap">{{ t(signup:forms.credentials.links.sign_in.prefix) }} </span><a href="#" data-action-ref="action_signin_usertype" class="rich-text-link"><span class="rich-text-pre-wrap">{{ t(signup:forms.credentials.links.sign_in.label) }}</span></a></p>
      resourceType: ELEMENT
      type: RICH_TEXT
  prompts:
  - inputs:
    - ref: usertype_input
      identifier: userType
      type: SELECT
      required: true
    action:
      ref: action_usertype
      nextNode: user_type_resolver
  - action:
      ref: action_signin_usertype
      nextNode: call_authentication
  layout:
    size:
      width: 350
      height: 500
    position:
      x: 370
      y: -319
- id: prompt_credentials
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signup:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
      width: ''
    - align: center
      type: TEXT
      id: heading_credentials
      label: '{{ t(signup:forms.credentials.title) }}'
      variant: HEADING_1
    - type: BLOCK
      id: block_credentials
      components:
      - type: TEXT_INPUT
        id: input_username
        ref: username
        label: '{{ t(signup:forms.credentials.fields.username.label) }}'
        placeholder: '{{ t(signup:forms.credentials.fields.username.placeholder) }}'
        required: true
      - type: PASSWORD_INPUT
        id: input_password
        ref: password
        label: '{{ t(signup:forms.credentials.fields.password.label) }}'
        placeholder: '{{ t(signup:forms.credentials.fields.password.placeholder) }}'
        required: true
      - type: ACTION
        id: action_credentials
        label: '{{ t(signup:forms.credentials.actions.continue.label) }}'
        variant: PRIMARY
        eventType: SUBMIT
    - category: DISPLAY
      id: rich_text_signin
      action:
        ref: action_signin
      label: <p data-component-ref="sign-in-link" class="rich-text-paragraph"><span class="rich-text-pre-wrap">{{ t(signup:forms.credentials.links.sign_in.prefix) }} </span><a href="#" data-action-ref="action_signin" class="rich-text-link"><span class="rich-text-pre-wrap">{{ t(signup:forms.credentials.links.sign_in.label) }}</span></a></p>
      resourceType: ELEMENT
      type: RICH_TEXT
  prompts:
  - inputs:
    - ref: input_username
      identifier: username
      type: TEXT_INPUT
      required: true
    - ref: input_password
      identifier: password
      type: PASSWORD_INPUT
      required: true
    action:
      ref: action_credentials
      nextNode: credentials_auth
  - action:
      ref: action_signin
      nextNode: call_authentication
  layout:
    size:
      width: 350
      height: 500
    position:
      x: 870
      y: 120
- id: credentials_auth
  type: TASK_EXECUTION
  executor:
    name: CredentialsAuthExecutor
  onSuccess: provisioning
  onFailure: prompt_credentials
  layout:
    size:
      width: 244
      height: 113
    position:
      x: 1427
      y: 589
- id: provisioning
  type: TASK_EXECUTION
  executor:
    name: ProvisioningExecutor
  onSuccess: end
  onIncomplete: prompt_schema_attrs
  layout:
    size:
      width: 244
      height: 113
    position:
      x: 1861
      y: 591
- id: prompt_schema_attrs
  type: PROMPT
  meta:
    components:
    - alt: '{{ t(signup:images.app_logo.alt) }}'
      category: DISPLAY
      height: '60'
      id: image
      resourceType: ELEMENT
      src: '{{ meta(application.logoUrl) }}'
      type: IMAGE
      width: ''
    - align: center
      type: TEXT
      id: heading_schema_attrs
      label: '{{ t(signup:forms.user_info.title) }}'
      variant: HEADING_1
    - type: BLOCK
      id: block_dynamic_user_inputs
      components:
      - type: DYNAMIC_INPUT_PLACEHOLDER
        id: dynamic_inputs
      - type: ACTION
        id: action_schema_attrs
        label: '{{ t(signup:forms.user_info.actions.continue.label) }}'
        variant: PRIMARY
        eventType: SUBMIT
  prompts:
  - inputs: []
    action:
      ref: action_schema_attrs
      nextNode: provisioning
  layout:
    size:
      width: 350
      height: 500
    position:
      x: 1986
      y: -188
- id: call_authentication
  type: CALL
  flow:
    ref: 01900000-0000-7000-8000-0000000e2e01
  onSuccess: end
  layout:
    size:
      width: 260
      height: 130
    position:
      x: 1402
      y: 828
- id: end
  type: END
  layout:
    size:
      width: 85
      height: 34
    position:
      x: 2451
      y: 629
---
resource_type: application
id: 01900000-0000-7000-8000-0000000e2e02
name: ThunderID.AspNetCore E2E
description: The web app the ThunderID.AspNetCore end-to-end tests sign in to
type: fullstack
ouHandle: default
url: https://localhost:7201
authFlowId: 01900000-0000-7000-8000-0000000e2e01
# ThunderID requires every flow a bound flow calls to be the app's binding for that type, so
# sign-up uses a copy of the default registration flow that returns to the E2E sign-in flow.
registrationFlowId: 01900000-0000-7000-8000-0000000e2e04
isRegistrationFlowEnabled: true
allowedUserTypes:
  - person
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: e2e-webapp
      clientSecret: e2e-test-only-client-secret-do-not-reuse
      redirectUris:
        - https://localhost:7201/signin-oidc
      postLogoutRedirectUris:
        - https://localhost:7201/signout-callback-oidc
      backchannelLogoutUri: http://host.docker.internal:5201/backchannel-logout
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      pkceRequired: true
      tokenEndpointAuthMethod: client_secret_post
      publicClient: false
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes:
              - given_name
              - family_name
              - email
              - name
        idToken:
          validityPeriod: 3600
          userAttributes:
            - given_name
            - family_name
            - email
            - name
      scopeClaims:
        profile:
          - name
          - given_name
          - family_name
        email:
          - email
---
resource_type: user
id: 01900000-0000-7000-8000-0000000e2e03
type: person
ouHandle: default
attributes:
  username: e2e-user
  sub: e2e-user
  email: e2e-user@example.com
  name: E2E User
  given_name: E2E
  family_name: User
credentials:
  password: e2e-test-only-User1
